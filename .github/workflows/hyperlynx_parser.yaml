
name: HyperLynx Parser CI

on:
  push:
    branches: [main, feat/hyperlynx-parser, hyperlynx-parser/ci]
  pull_request:
    branches: [main, feat/hyperlynx-parser, hyperlynx-parser/ci]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.0.1
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          crates/hyperlynx-parser/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('crates/hyperlynx-parser/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Check formatting
      working-directory: crates/hyperlynx-parser
      run: cargo fmt --all -- --check

    - name: Run Clippy
      working-directory: crates/hyperlynx-parser
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Build
      working-directory: crates/hyperlynx-parser
      run: cargo build --verbose

    - name: Run tests
      working-directory: crates/hyperlynx-parser
      run: cargo test --verbose
