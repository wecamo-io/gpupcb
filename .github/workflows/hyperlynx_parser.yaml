
name: HyperLynx Parser CI

on:
  push:
    branches: [main, feat/hyperlynx-parser, hyperlynx-parser/ci]
  pull_request:
    branches: [main, feat/hyperlynx-parser, hyperlynx-parser/ci]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      working-directory: crates/hyperlynx-parser
      run: cargo build --verbose
    - name: Run tests
      working-directory: crates/hyperlynx-parser
      run: cargo test --verbose
