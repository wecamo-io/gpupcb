[package]
name = "gpupcb-app"
version = "0.1.0"
description = "GPUPCB App"
authors = ["Wecamo"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gpupcb_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# common deps
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
hyperlynx-parser = { path = "../crates/hyperlynx-parser/" }

# dependencies to load when in Desktop
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
encoding_rs = "0.8.44"

# dependencies to load when in browser
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.130"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
